openapi: 3.0.3
info:
  title: service-registry
  version: 1.0.0
  description: |
    全局独立的**服务注册中心**：服务契约（含对外 API 这一基础属性）与实例元信息的
    唯一存储中心。其他平台**从本中心拉取**服务元信息（快照 / 增量游标 / SSE）。

    **语义边界：本中心只记录"登记了什么"——不探活、不心跳、不启停任何进程，
    也不保证实例可达。** 可达性由消费方自行校验（契约里的 `healthPath` 只是元信息）。

    **MCP 聚合**：`GET /v1/mcp/servers` 把每个服务的 `mcpPath` 接到实例地址上，只读登记数据。
    `POST /mcp` 是给 agent 的 Streamable HTTP 入口：工具名是 `namespace__service__tool`，
    调用时才转发到该服务自己的 MCP。某个后端连不上只影响那一次调用。

    **Agent 要加载的 MCP 列表**：`GET /v1/agent/mcp-servers` 返回 `{"mcpServers": {名字: 配置}}`，
    配置是 stdio（command/args/env/cwd）、http 或 sse。这是单独登记的元信息，
    不是从服务实例推出来的。本中心不启动这些进程，也不请求这些地址。

    鉴权：
      - 读接口默认开放（`REGISTRY_READ_AUTH=open`），便于各平台拉取元信息。
      - **写接口默认开放**（`REGISTRY_WRITE_AUTH=open`）：不带令牌也能登记/维护，actor 记为
        anonymous。收紧方式是把该变量设为 `token`（重启即可，令牌无需重新分发）：
        此时写接口需要 `Authorization: Bearer <token>` 或 `X-Registry-Token`，
        `admin token` 全权，`namespace token` 只能写自己那个命名空间。
      - 无论开关如何：带了合法令牌就按身份记账（审计里能看出是谁改的）；带了非法令牌一律 403。
      - 当前状态随时可从 GET /v1/meta 的 `writeAuth` 字段读到。
    error 响应统一为 `{"error":{"code":"...","message":"..."}}`。

    **部门属性**：服务契约上的 `departmentId` / `departmentName` 的权威数据在
    **组织架构服务**（organization，`GET /api/v1/departments`）——本中心不维护部门，
    登记时按当天目录对齐（`REGISTRY_ORG_URL` 配置，短 TTL 缓存），
    并把目录透出为 `GET /v1/departments` 供面板/消费方使用；
    组织接口不可达时按声明值保存（不阻塞本中心的读写）。
servers:
  - url: http://127.0.0.1:4240
tags:
  - name: register
    description: 注册与维护（写）
  - name: discover
    description: 发现与查询（读）
  - name: pull
    description: 给其他平台拉取（快照 / 增量 / 实时）
  - name: admin
    description: 命名空间与令牌管理
  - name: ops
    description: 运维

paths:
  /health:
    get:
      tags: [ops]
      summary: 存活探针（平台约定路径）
      responses:
        '200': { description: 进程存活 }
  /healthz:
    get:
      tags: [ops]
      summary: /health 的别名
      responses:
        '200': { description: 同上 }
  /readyz:
    get:
      tags: [ops]
      summary: 就绪探针（数据库可读写）
      responses:
        '200': { description: 就绪 }
        '503': { description: 数据库不可用 }
  /metrics:
    get:
      tags: [ops]
      summary: Prometheus 指标（读数抓取时现算）
      responses:
        '200':
          description: 文本格式指标
          content:
            text/plain: { schema: { type: string } }
  /v1/meta:
    get:
      tags: [ops]
      summary: 运行期元信息（版本、计数、当前 revision、写权限状态、语义声明）
      responses:
        '200':
          description: 元信息
          content:
            application/json: { schema: { type: object } }

  /v1/snapshot:
    get:
      tags: [pull]
      summary: 全量快照（平台冷启动用）
      description: |
        返回全部命名空间、服务契约（含端点索引）与实例，并带上当前 `revision`。
        响应带 `ETag`（与 revision 绑定），下次请求可带 `If-None-Match`：
        未变化时返回 `304 Not Modified`，省掉整个响应体。
      parameters:
        - { in: query, name: namespace, schema: { type: string }, description: 只取某个命名空间 }
        - { in: header, name: If-None-Match, schema: { type: string } }
      responses:
        '200':
          description: 全量快照
          content:
            application/json: { schema: { $ref: '#/components/schemas/Snapshot' } }
        '304': { description: 与上次相比没有变化 }

  /v1/changes:
    get:
      tags: [pull]
      summary: 按 revision 游标增量拉取（支持 long-poll）
      description: |
        每个服务/实例/命名空间的增删改都会产生一条**全局递增 revision** 的变更记录。
        平台保存最后一次的 `revision`，之后按 `since=<last>` 增量获取即可。

        `wait=30s` 时若暂无变更则挂起等待（long-poll），有新变更立即返回；
        挂起上限由 `REGISTRY_PULL_WAIT_MAX` 限制，返回值里的 `waited` 表示本次是否挂起过。
      parameters:
        - { in: query, name: since, schema: { type: integer, format: int64, default: 0 }, description: 只返回 revision > since }
        - { in: query, name: limit, schema: { type: integer, default: 100 } }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: wait, schema: { type: string, example: 30s }, description: long-poll 时长（也可传秒数） }
      responses:
        '200':
          description: 变更列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision: { type: integer, format: int64, description: 当前全局 revision }
                  changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
                  hasMore: { type: boolean }
                  waited: { type: boolean, description: 是否因 wait 挂起过 }

  /v1/events:
    get:
      tags: [pull]
      summary: 实时变更订阅（SSE）
      description: |
        `text/event-stream` 流：
          - `event: hello`  建立连接时的当前 revision
          - `event: change` 每一条变更（与 /v1/changes 同构）
          - `: ping`        保活注释
        参数 `since` 可指定起始游标；`namespace` / `service` 可过滤。
      parameters:
        - { in: query, name: since, schema: { type: integer, format: int64 } }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: service, schema: { type: string } }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream: { schema: { type: string } }

  /v1/audit:
    get:
      tags: [pull]
      summary: 审计查询（谁在何时改了什么）
      description: 与 /v1/changes 同一张表，额外支持按实体/引用/操作过滤。
      parameters:
        - { in: query, name: since, schema: { type: integer, format: int64 } }
        - { in: query, name: limit, schema: { type: integer, default: 100 } }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: entity, schema: { type: string, enum: [namespace, service, instance, mcp_server] } }
        - { in: query, name: ref, schema: { type: string, example: 'default/event-center' } }
        - { in: query, name: op, schema: { type: string, enum: [create, update, delete] } }
      responses:
        '200':
          description: 审计条目
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision: { type: integer, format: int64 }
                  entries: { type: array, items: { $ref: '#/components/schemas/Change' } }
                  hasMore: { type: boolean }

  /v1/services:
    get:
      tags: [discover]
      summary: 服务目录（可跨命名空间检索）
      parameters:
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: tag, schema: { type: string } }
        - { in: query, name: owner, schema: { type: string } }
        - { in: query, name: protocol, schema: { type: string } }
        - in: query
          name: department
          schema: { type: string, example: D0001 }
          description: 按**归属部门**过滤（departmentId 或 departmentName 命中其一即可）
        - { in: query, name: q, schema: { type: string }, description: 关键字（名字/描述/owner/version/仓库地址/部门） }
        - { in: query, name: limit, schema: { type: integer, default: 200, maximum: 2000 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: 服务列表（含端点索引与实例数）
          content:
            application/json:
              schema:
                type: object
                properties:
                  services: { type: array, items: { $ref: '#/components/schemas/Service' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }

  /v1/mcp/servers:
    get:
      tags: [discover]
      summary: MCP 目录（每个服务的 MCP 地址）
      description: |
        用契约上的 `mcpPath`（默认 `/mcp`）接到该服务每个 HTTP(S) 实例的
        `scheme://host:port` 后面。没有实例的服务仍出现，`endpoints` 为空。
        tcp/tls 实例不产生 MCP 地址。本接口不访问这些地址。
      parameters:
        - { in: query, name: namespace, schema: { type: string } }
      responses:
        '200':
          description: MCP 目录，以及本中心自己的聚合入口
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers: { type: array, items: { $ref: '#/components/schemas/MCPServer' } }
                  mcpPath: { type: string, example: /mcp }
                  mcpTransport: { type: string, example: streamable-http }

  /v1/agent/mcp-servers:
    get:
      tags: [discover]
      summary: Agent 要加载的 MCP 列表（mcpServers 配置）
      description: |
        返回 agent（Cursor 等）可以直接加载的 MCP 配置：

        ```json
        { "mcpServers": { "名字": { ...配置 } } }
        ```

        每一项是下面三种之一：

        - 本地进程：`command` / `args` / `env` / `cwd`（不写 `type`，或登记时写 `stdio`）
        - HTTP：`type: http`、`url`、可选 `headers`
        - SSE：`type: sse`、`url`、可选 `headers`

        名单来自 `PUT /v1/namespaces/{ns}/agent/mcp-servers/{name}` 的登记，
        **不是**把服务实例的 `mcpPath` 拼出来（那是 `GET /v1/mcp/servers`）。
        没有实例、服务没声明 MCP，都不影响这份列表。

        本接口只读登记数据：不启动 `command`，不请求 `url`。
        `headers` 与 `env` 会原样返回，因为 agent 连接时要用；读接口默认开放，
        不要把不该出现在本机注册中心上的凭据登记进来。
        名字全局唯一（agent 用它当键）。`namespace` 只筛出该命名空间登记的那些。
      parameters:
        - { in: query, name: namespace, schema: { type: string }, description: 只返回这个命名空间登记的 MCP 服务；省略则全部 }
      responses:
        '200':
          description: agent 可直接加载的 MCP 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPServerList' }
              example:
                mcpServers:
                  git-via-proxy:
                    command: node
                    args: ["/absolute/path/to/server.mjs"]
                    env:
                      GIT_VIA_PROXY_URL: "http://127.0.0.1:7897"
                    cwd: /absolute/path/to/server-dir
                  docs:
                    type: http
                    url: https://example.com/mcp
                    headers:
                      Authorization: "Bearer token"
                  events:
                    type: sse
                    url: https://example.com/sse

  /mcp:
    post:
      tags: [discover]
      summary: MCP 聚合入口（Streamable HTTP）
      description: |
        Agent 只连这一个地址。`tools/list` 里固定有 `registry_mcp_servers`（目录，不访问后端）。
        其余工具来自各服务自己的 MCP，名字是 `namespace__service__tool`，`tools/call` 原样转发。
        请求头 `identity_role` / `identity_id` 会跟着转发。
        Accept 必须同时包含 `application/json` 和 `text/event-stream`。
      responses:
        '200':
          description: MCP JSON-RPC 响应
        '401':
          description: 读接口要求令牌时未携带

  /v1/departments:
    get:
      tags: [discover]
      summary: 部门目录（**数据来自组织架构服务**，本中心只取回来转给消费方/面板）
      description: |
        服务契约的「部门」属性以**组织架构服务**（organization）为权威：
        本中心不拥有部门数据，这里只是把组织服务的 `GET /api/v1/departments`
        按短 TTL 缓存后透出，供面板做下拉、供消费方做校验/联表。

        - 组织接口位置由 `REGISTRY_ORG_URL` 配置（默认 `http://127.0.0.1:4244`；
          `off` 关闭该能力），见 GET /v1/meta 的 `organization` 字段。
        - 组织接口不可达时**不报错**：返回 `available=false` + `stale=true` +
          上次成功的目录 + `error` 说明，消费方据此降级（写契约也一样不被阻塞）。
        - `source` 恒为 `organization`，用来标明"这份数据不是本中心自己编的"。
      parameters:
        - { in: query, name: refresh, schema: { type: boolean }, description: 强制出网刷新（跳过 TTL 缓存） }
      responses:
        '200':
          description: 部门目录 + 数据成色（enabled/available/cached/stale）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentCatalog' }

  /v1/orgs/{orgId}/services:
    get:
      tags: [discover]
      summary: 按组织（部门）查服务列表（`org_id` 即契约上的 `departmentId`）
      description: |
        **组织视角**的查询：这个组织（部门）里有哪些服务。

        - `orgId` 就是服务契约上的 `departmentId` —— 组织架构服务（organization）里的
          部门 ID（如 `D0005`），目录见 GET /v1/departments。
        - **只认 ID**：不认名称、不做模糊匹配（ID 稳定，名称会变）。要按名称/关键字找服务，
          用 `GET /v1/services?department=` 或 `?q=`。
        - ID 比较忽略 ASCII 大小写：`d0005` 与 `D0005` 是同一个组织。
        - 响应带上**这个组织是谁**（`org`：名称/类型/父部门，字段来自组织接口）与
          **目录数据的成色**（`organization`：enabled/available/cached/stale/error），
          调用方不必自己再查一次部门目录。
        - 失败方向与 `/v1/departments` 一致：**组织接口挂了不影响这条查询** —— 依然 200，
          照常列出本中心按其 ID 登记的服务，并用 `org.resolved` + `org.note` +
          `organization.*` 说明"没对上、原因是什么"。只有「目录可用且非空 + ID 不在目录里
          + 本中心也没有服务登记在它下面」三条同时成立才是 404（事实清楚才报不存在）。
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: string, example: D0005 }
          description: 组织（部门）ID = 服务契约上的 departmentId
        - { in: query, name: namespace, schema: { type: string }, description: 只看某个命名空间下的服务 }
        - { in: query, name: tag, schema: { type: string } }
        - { in: query, name: owner, schema: { type: string } }
        - { in: query, name: protocol, schema: { type: string } }
        - { in: query, name: q, schema: { type: string }, description: 关键字（名字/描述/owner/version/仓库地址/部门） }
        - { in: query, name: limit, schema: { type: integer, default: 200, maximum: 2000 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
        - { in: query, name: refresh, schema: { type: boolean }, description: 强制出网刷新部门目录（跳过 TTL 缓存） }
      responses:
        '200':
          description: 该组织下的服务列表 + 组织信息 + 部门目录成色
          content:
            application/json: { schema: { $ref: '#/components/schemas/OrgServices' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/namespaces/{ns}/services:
    get:
      tags: [discover]
      summary: 某命名空间下的服务目录
      parameters:
        - $ref: '#/components/parameters/ns'
        - { in: query, name: tag, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200': { description: 同 /v1/services }

  /v1/instances/{id}:
    get:
      tags: [discover]
      summary: 按实例 ID 全局查询（不需要知道它属于哪个服务）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, example: inst_01J8Z9K3M4N5P6Q7R8S9T0V1W2 } }
      responses:
        '200':
          description: 实例
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { $ref: '#/components/schemas/Instance' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/search/apis:
    get:
      tags: [discover]
      summary: 反向查找——"这个接口谁提供"
      description: |
        `path` 支持三种写法：
          1. 具体路径 `/v1/streams/abc/events` → 命中登记的模板 `/v1/streams/{stream}/events`（matchType=template）
          2. 登记模板原样 `/v1/streams/{stream}/events` → matchType=exact
          3. 通配 `/v1/streams/**` → `*` 匹配单段、`**` 跨段（matchType=glob）

        默认按 精确 → 模板 → 通配 依次尝试；`match=` 可强制指定其中一种。
      parameters:
        - { in: query, name: method, schema: { type: string, example: GET } }
        - { in: query, name: path, schema: { type: string } }
        - { in: query, name: match, schema: { type: string, enum: [exact, template, glob] } }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: tag, schema: { type: string }, description: 端点标签 }
        - { in: query, name: department, schema: { type: string }, description: 只看某个部门（departmentId 或 departmentName）提供的接口 }
        - { in: query, name: q, schema: { type: string }, description: 关键字（服务名/描述/摘要/路径/部门） }
        - { in: query, name: limit, schema: { type: integer, default: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: 命中列表（精确/模板命中排在通配之前）
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches: { type: array, items: { $ref: '#/components/schemas/EndpointMatch' } }
                  total: { type: integer }
                  hasMore: { type: boolean }
                  query: { type: object }


  /v1/namespaces:
    get:
      tags: [admin]
      summary: 命名空间列表（含服务/实例计数）
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces: { type: array, items: { $ref: '#/components/schemas/Namespace' } }
                  total: { type: integer }
    post:
      tags: [admin]
      summary: 创建命名空间（需要 admin 令牌）
      description: 返回体中含**一次性**注册令牌（服务端只存哈希，之后无法再次查看）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: team-a }
                description: { type: string }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { $ref: '#/components/schemas/Namespace' }
                  token: { type: string, description: 只显示这一次 }
                  note: { type: string }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/namespaces/{ns}:
    get:
      tags: [discover]
      summary: 读取命名空间
      parameters: [{ $ref: '#/components/parameters/ns' }]
      responses:
        '200':
          description: 命名空间
          content:
            application/json:
              schema: { type: object, properties: { namespace: { $ref: '#/components/schemas/Namespace' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      summary: 更新命名空间描述（需要 admin 令牌）
      parameters: [{ $ref: '#/components/parameters/ns' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { description: { type: string } } }
      responses:
        '200': { description: 更新后的命名空间 }
    delete:
      tags: [admin]
      summary: 删除命名空间（连带其全部服务与实例；需要 admin 令牌 + 显式确认）
      parameters:
        - $ref: '#/components/parameters/ns'
        - { in: query, name: confirm, required: true, schema: { type: string }, description: 必须等于命名空间名 }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/namespaces/{ns}/token:
    post:
      tags: [admin]
      summary: 轮换命名空间令牌（旧令牌立即失效）
      parameters: [{ $ref: '#/components/parameters/ns' }]
      responses:
        '200':
          description: 新令牌（只显示这一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  token: { type: string }
                  note: { type: string }
    delete:
      tags: [admin]
      summary: 清除命名空间令牌（此后仅 admin 令牌可写）
      parameters: [{ $ref: '#/components/parameters/ns' }]
      responses:
        '200': { description: 已清除 }

  /v1/namespaces/{ns}/agent/mcp-servers/{name}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - { in: path, name: name, required: true, schema: { type: string }, description: MCP 服务名（agent 列表里的键，全局唯一） }
    put:
      tags: [register]
      summary: 登记或更新一个 agent MCP 服务（幂等）
      description: |
        请求体就是 agent 列表里那一项配置（名字在路径上，不在 body 里）。
        本地进程给 `command`（`type` 可省略）；远程给 `type` 为 `http` 或 `sse` 再加 `url`。
        内容与已登记的完全一致时返回 200，不推进 revision。
        同名已被其他命名空间登记时 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentMCPServerConfig' }
      responses:
        '201':
          description: 新建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPServerWriteResult' }
        '200':
          description: 更新（含内容未变化）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPServerWriteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [register]
      summary: 删除一个 agent MCP 服务
      responses:
        '204': { description: 已删除 }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/namespaces/{ns}/services/{svc}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/svc'
    get:
      tags: [discover]
      summary: 服务契约详情（含对外 API 端点索引与实例数）
      responses:
        '200':
          description: 契约
          content:
            application/json:
              schema: { type: object, properties: { service: { $ref: '#/components/schemas/Service' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [register]
      summary: 登记或更新服务契约（幂等）
      description: |
        **服务的对外 API 是本注册中心的基础属性**：请求体必须提供
        `api.spec`（内联 OpenAPI 3.x / Swagger 2.0 原文，YAML 或 JSON）或
        `api.endpoints`（显式端点列表），否则 400。

        提供 `api.spec` 时：服务端解析出端点索引、计算 `specHash` 并原样保存原文
        （可通过 `.../spec` 取回）；`api.endpoints` 优先于从 spec 解析的结果。

        端点索引是**整体替换**：本次没写进去的端点不会残留。
        实例地址不在这个接口登记，走 `.../instances`。
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ServiceWrite' } }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { $ref: '#/components/schemas/Service' }
                  created: { type: boolean }
        '200':
          description: 已更新（幂等重复登记）
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { $ref: '#/components/schemas/Service' }
                  created: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [register]
      summary: 删除服务契约（连带其端点索引与全部实例）
      responses:
        '204': { description: 已删除 }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/namespaces/{ns}/services/{svc}/spec:
    get:
      tags: [discover]
      summary: 取回内联 OpenAPI 原文（可直接喂给工具链）
      parameters:
        - $ref: '#/components/parameters/ns'
        - $ref: '#/components/parameters/svc'
        - { in: query, name: download, schema: { type: boolean }, description: 触发浏览器下载（Content-Disposition） }
      responses:
        '200':
          description: 规范原文
          content:
            application/yaml: { schema: { type: string } }
            application/json: { schema: { type: object } }
        '404': { $ref: '#/components/responses/NotFound' }


  /v1/namespaces/{ns}/services/{svc}/announce:
    put:
      tags: [register]
      summary: 服务上报自己的监听地址（幂等）
      description: |
        给正在运行的服务用：路径是「我是谁」，请求体至少给出 `port` 和机器 `os`。
        `host` 省略时用这次连接的对端地址（本机进程连 `127.0.0.1` 时就是 `127.0.0.1`）。
        `scheme` 省略时为 `http`。

        按 `(scheme, host, port)` 对齐这一条实例：没有就新建（201），已有且内容没变就返回 200
        且不推进 revision。不会摘掉同一服务的其他实例（整组对齐仍走 PUT `.../instances`）。
        服务契约必须已经登记。这不是心跳，也没有 TTL。
      parameters:
        - $ref: '#/components/parameters/ns'
        - $ref: '#/components/parameters/svc'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port, os]
              properties:
                port: { type: integer, minimum: 1, maximum: 65535, example: 9099 }
                host:
                  type: string
                  description: 省略时用请求对端地址
                  example: 127.0.0.1
                scheme: { type: string, enum: [http, https, tcp, tls], default: http }
                os: { type: string, enum: [linux, mac, windows], description: 这台机器的操作系统 }
                arch: { type: string, enum: [amd64, arm64, 386, arm] }
                metadata: { type: object, additionalProperties: { type: string } }
      responses:
        '201':
          description: 新建了这条实例
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { $ref: '#/components/schemas/Instance' }
                  created: { type: boolean, example: true }
        '200':
          description: 同一地址已登记（内容未变，或只刷新了 os/arch/metadata）
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { $ref: '#/components/schemas/Instance' }
                  created: { type: boolean, example: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/namespaces/{ns}/services/{svc}/instances:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/svc'
    get:
      tags: [discover]
      summary: 实例列表（发现）
      description: |
        返回该服务登记的全部实例。本中心**不探活**，所以这里没有"健康/可用"字段——
        可用性由消费方自行校验（`healthPath` 只是元信息）。

        `pick=random` 直接返回一个随机实例（无状态的便利项）。轮询/权重不提供：
        在一个被多个消费方共用的注册中心里，共享轮次语义不成立。
      parameters:
        - { in: query, name: pick, schema: { type: string, enum: [random] } }
        - { in: query, name: meta, schema: { type: string, example: 'zone=a' }, description: 按实例元信息过滤（可重复） }
      responses:
        '200':
          description: 实例列表；pick=random 时返回单个实例
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  service: { type: string }
                  instances: { type: array, items: { $ref: '#/components/schemas/Instance' } }
                  total: { type: integer }
                  instance: { $ref: '#/components/schemas/Instance' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [register]
      summary: 声明式同步实例集合（推荐给 CI / 部署流水线）
      description: |
        传"期望的实例集合"，服务端做 diff：补齐缺失的、更新变化的、**摘除多余的**。
        幂等：用同一集合重复调用时全部计入 `unchanged`。

        实例身份：优先按 `id` 匹配，其次按 `(scheme,host,port)`。因此"换了地址但没带
        `id`"会被记作"删旧 + 建新"；想让它算"同一个实例换地址"，请带上原来的 `id`。

        每一条实例都必须带 `os`（机器操作系统：`linux` / `mac` / `windows`）。
        缺了或取值不对 → 400。这是实例所在机器的系统，和契约上 app 的 `os` 不是同一个字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instances: { type: array, items: { $ref: '#/components/schemas/InstanceWrite' } }
      responses:
        '200':
          description: diff 结果
          content:
            application/json: { schema: { $ref: '#/components/schemas/SyncResult' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [register]
      summary: 登记单个实例
      description: 必须带 `os`（`linux` / `mac` / `windows`），记的是这台机器的操作系统。
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InstanceWrite' } }
      responses:
        '201':
          description: 已登记
          content:
            application/json:
              schema: { type: object, properties: { instance: { $ref: '#/components/schemas/Instance' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/namespaces/{ns}/services/{svc}/instances/{id}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/svc'
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [discover]
      summary: 读取单个实例
      responses:
        '200': { description: 实例 }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [register]
      summary: 部分更新实例（scheme/host/port/os/arch/metadata）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scheme: { type: string, enum: [http, https, tcp, tls] }
                host: { type: string }
                port: { type: integer }
                os: { type: string, enum: [linux, mac, windows], description: 机器操作系统；给出则必须是 linux/mac/windows }
                arch: { type: string, enum: [amd64, arm64, 386, arm], description: 机器架构；给出则必须是 amd64/arm64/386/arm（x86_64→amd64，aarch64→arm64）；空字符串表示清空 }
                metadata: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: 更新后的实例
          content:
            application/json:
              schema: { type: object, properties: { instance: { $ref: '#/components/schemas/Instance' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [register]
      summary: 注销实例
      responses:
        '204': { description: 已注销 }
        '404': { $ref: '#/components/responses/NotFound' }


components:
  parameters:
    ns:
      in: path
      name: ns
      required: true
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$' }
      description: 命名空间
    svc:
      in: path
      name: svc
      required: true
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$' }
      description: 服务名

  responses:
    BadRequest:
      description: 请求不合法（字段校验失败、API 来源缺失、规格无法解析等）
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    NotFound:
      description: 对象不存在
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    Conflict:
      description: 冲突（同名对象已存在 / 实例地址重复）
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: not_found }
            message: { type: string }

    AuthScheme:
      type: object
      description: 服务对外 API 的鉴权方式（元信息，仅用于展示与检索）
      properties:
        scheme: { type: string, example: bearer }
        in: { type: string, enum: [header, query, cookie] }
        name: { type: string, example: Authorization }
        notes: { type: string }

    Endpoint:
      type: object
      description: 服务对外 API 的一个端点
      properties:
        method: { type: string, example: GET }
        path: { type: string, example: '/v1/streams/{stream}/events' }
        summary: { type: string }
        operationId: { type: string }
        tags: { type: array, items: { type: string } }
        auth: { type: array, items: { type: string }, description: 引用的 securityScheme 名 }

    ServiceAPI:
      type: object
      description: 服务的对外 API 描述（spec 原文不在这里返回，走 .../spec）
      properties:
        protocols: { type: array, items: { type: string }, example: [http] }
        authSchemes: { type: array, items: { $ref: '#/components/schemas/AuthScheme' } }
        docsUrl: { type: string }
        specUrl: { type: string, description: 外部规范链接（只存不抓取） }
        specHash: { type: string, description: 内联规范原文的 sha256 }
        specBytes: { type: integer }
        hasSpec: { type: boolean }
        endpoints: { type: array, items: { $ref: '#/components/schemas/Endpoint' } }

    Department:
      type: object
      description: 一个部门（**字段原样来自组织架构服务**，本中心不加工/不重命名）
      properties:
        id: { type: string, example: D0001, description: 稳定标识（服务契约的 departmentId 引用的就是它） }
        name: { type: string, example: SRE部门 }
        type: { type: string, example: 研发, description: 部门类型（研发/测试/产品/管理 等，由组织接口定义） }
        parentId:
          type: string
          example: D0001
          description: |
            可选的上级部门 ID：组织接口给这个字段说明部门自己就是一棵树（集团 → 事业群 → 部门）。
            本中心**原样透出、不做层级加工**（不校验父是否存在），面板的「服务树」页签用它把部门摆成层级；
            为空 = 顶层部门（扁平目录就是这个形态）。

    DepartmentCatalog:
      type: object
      description: |
        部门目录 + **数据成色**（永远 200，用 available/cached/stale/error 说明这份数据能不能当权威用）。
        组织接口不可达时返回上次成功的目录（stale=true）或空列表 + error，消费方据此降级显示。
      properties:
        source: { type: string, enum: [organization], description: 数据来源标识（说明"这不是本中心自己编的"） }
        url: { type: string, description: 组织接口基地址（未配置时为空） }
        path: { type: string, example: /api/v1/departments }
        enabled: { type: boolean, description: 是否配置了组织接口（REGISTRY_ORG_URL） }
        available: { type: boolean, description: 本次是否真的从组织接口取到了数据 }
        cached: { type: boolean, description: 结果来自 TTL 缓存（未出网） }
        stale: { type: boolean, description: 组织接口不可达，用的是上次成功的数据 }
        fetchedAt: { type: string, format: date-time, description: 这份数据的取回时间 }
        error: { type: string, description: 失败原因（available=false 时） }
        departments: { type: array, items: { $ref: '#/components/schemas/Department' } }
        types: { type: array, items: { type: string }, description: 部门类型候选（组织接口给出时） }

    OrgServices:
      type: object
      description: |
        按组织（部门）查到的服务列表 + 这个组织是谁 + 部门目录的成色。
        `org.resolved` 说明 orgId 是否在组织接口的目录里对上了；没对上时 `org.note`
        给出原因（目录里没有 / 组织接口不可达 / 未配置组织接口），服务列表照常返回。
      properties:
        org:
          type: object
          description: 本次查询的组织（部门）—— 字段来自组织接口，resolved=false 时只有 id 与 note
          properties:
            id: { type: string, example: D0005 }
            name: { type: string, example: AI研发部 }
            type: { type: string, example: 研发 }
            parentId: { type: string, example: D0001, description: 组织接口给了就原样带出（本中心不做层级加工） }
            resolved: { type: boolean, description: 这个 ID 是否在组织接口的部门目录里对上了 }
            note: { type: string, description: 人类可读说明（对齐结果或没能对齐的原因） }
        organization:
          type: object
          description: 部门目录这份数据的成色（与 GET /v1/departments 同源，不带 departments 列表）
          properties:
            enabled: { type: boolean }
            available: { type: boolean }
            cached: { type: boolean }
            stale: { type: boolean }
            url: { type: string }
            path: { type: string, example: /api/v1/departments }
            fetchedAt: { type: string, format: date-time }
            error: { type: string, description: 组织接口不可达时的失败原因 }
        services: { type: array, items: { $ref: '#/components/schemas/Service' } }
        total: { type: integer, description: 该组织下满足过滤条件的服务总数（不受分页影响） }
        limit: { type: integer }
        offset: { type: integer }

    Service:
      type: object
      description: 服务契约（低频变更）
      properties:
        namespace: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [service, app]
          default: service
          description: 登记对象类型：service（后端服务，默认）或 app（移动/桌面应用）
        appId:
          type: string
          description: type 为 app 时的稳定应用标识；type 为 service 时为空
        os:
          type: string
          enum: [Android, iOS, MacOS, Windows, Linux]
          description: type 为 app 时选择的操作系统
        version: { type: string }
        owner: { type: string }
        description: { type: string }
        gitRepoUrl:
          type: string
          description: 代码仓库地址（只存不 clone、不抓取；支持 https/ssh URL 与 git@host:org/repo.git 写法）
        departmentId:
          type: string
          description: 归属部门 ID（**引用组织架构服务**里的稳定标识，如 D0001；组织接口见 GET /v1/departments）
          example: D0001
        departmentName:
          type: string
          description: 归属部门名（冗余存一份展示名，消费方不必再查组织接口；与 departmentId 由服务端按组织接口对齐）
          example: SRE部门
        tags: { type: array, items: { type: string } }
        basePath: { type: string }
        healthPath: { type: string, description: 元信息：消费方/看门狗可据此自行探活 }
        mcpPath:
          type: string
          default: /mcp
          description: 该服务的 MCP 地址（相对实例根路径，接到 scheme://host:port 后面）。没写时为 /mcp
        api: { $ref: '#/components/schemas/ServiceAPI' }
        revision: { type: integer, format: int64, description: 最后一次被改时的全局 revision }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        registeredBy: { type: string, description: 谁登记/改的（审计） }
        instanceCount: { type: integer }

    AgentMCPServerList:
      type: object
      description: agent 可直接加载的 MCP 配置。键是服务名。
      required: [mcpServers]
      properties:
        mcpServers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AgentMCPServerConfig' }

    AgentMCPServerConfig:
      description: |
        一项 MCP 配置。三选一：本地进程（不写 type）、`type: http`、`type: sse`。
      oneOf:
        - $ref: '#/components/schemas/AgentMCPStdio'
        - $ref: '#/components/schemas/AgentMCPHTTP'
        - $ref: '#/components/schemas/AgentMCPSSE'

    AgentMCPStdio:
      type: object
      description: 本地进程。agent 自己启动，本中心不执行 command。
      required: [command]
      properties:
        command: { type: string, example: node }
        args:
          type: array
          items: { type: string }
          example: ["/absolute/path/to/server.mjs"]
        env:
          type: object
          additionalProperties: { type: string }
          example:
            GIT_VIA_PROXY_URL: "http://127.0.0.1:7897"
        cwd: { type: string, example: /absolute/path/to/server-dir }

    AgentMCPHTTP:
      type: object
      required: [type, url]
      properties:
        type: { type: string, enum: [http] }
        url: { type: string, example: https://example.com/mcp }
        headers:
          type: object
          additionalProperties: { type: string }
          description: 原样返回给 agent。读接口默认开放，不要登记不该出现在本机的凭据。
          example:
            Authorization: "Bearer token"

    AgentMCPSSE:
      type: object
      required: [type, url]
      properties:
        type: { type: string, enum: [sse] }
        url: { type: string, example: https://example.com/sse }
        headers:
          type: object
          additionalProperties: { type: string }

    AgentMCPServerWriteResult:
      type: object
      properties:
        namespace: { type: string }
        name: { type: string }
        mcpServer: { $ref: '#/components/schemas/AgentMCPServerConfig' }

    MCPServer:
      type: object
      description: 一个已登记服务的 MCP 地址（目录，不代表该地址当前可达）
      properties:
        namespace: { type: string }
        service: { type: string }
        description: { type: string }
        mcpPath: { type: string, example: /mcp }
        endpoints:
          type: array
          items:
            type: object
            properties:
              instanceId: { type: string }
              url: { type: string, example: http://10.0.0.2:4220/mcp }
              scheme: { type: string, enum: [http, https] }
              host: { type: string }
              port: { type: integer }

    ServiceWrite:
      type: object
      description: 登记契约的请求体（与 Service 同构，可"GET → 改 → PUT"闭环）
      properties:
        type:
          type: string
          enum: [service, app]
          default: service
          description: 登记对象类型；缺省为 service。填 app 时 appId 与 os 必填
        appId:
          type: string
          description: type 为 app 时必填的稳定应用标识（也接受 app_id 别名）
        os:
          type: string
          enum: [Android, iOS, MacOS, Windows, Linux]
          description: type 为 app 时必选的操作系统
        version: { type: string }
        owner: { type: string }
        description: { type: string }
        gitRepoUrl:
          type: string
          description: 代码仓库地址（可留空；只校验形状，不去访问）
          example: https://github.com/kaulie/event-center.git
        departmentId:
          type: string
          description: |
            归属部门 ID（组织架构服务里的标识）。给 departmentId 或 departmentName 其一即可：
            服务端会拿组织接口的部门目录把另一个补全（部门改名后重新登记会自动纠回来）。
            组织接口可用且目录非空时，给了不存在的 departmentId → 400；
            组织接口不可达时按声明值保存（**不因别的服务挂了而登记失败**）。
            只给 departmentName 时永远只当标签存，不做存在性校验。
          example: D0001
        departmentName:
          type: string
          description: 归属部门名（与 departmentId 二选一；见 departmentId 的说明）
          example: SRE部门
        tags: { type: array, items: { type: string } }
        basePath: { type: string }
        healthPath: { type: string, description: 必须以 / 开头 }
        mcpPath:
          type: string
          default: /mcp
          description: 该服务的 MCP 地址，必须以 / 开头的路径。留空时收成 /mcp
          example: /mcp
        api:
          allOf:
            - $ref: '#/components/schemas/ServiceAPI'
            - type: object
              properties:
                spec: { type: string, description: 内联 OpenAPI 3.x / Swagger 2.0 原文（YAML 或 JSON，仅写入用） }
                specFormat: { type: string, enum: [yaml, json], description: 省略时按内容自动判定 }


    Instance:
      type: object
      description: 实例元信息（没有任何运行时状态位：不探活、不心跳）
      properties:
        id: { type: string, example: inst_01J8Z9K3M4N5P6Q7R8S9T0V1W2 }
        namespace: { type: string }
        service: { type: string }
        scheme: { type: string, enum: [http, https, tcp, tls] }
        host: { type: string }
        port: { type: integer }
        os:
          type: string
          enum: [linux, mac, windows]
          description: 实例所在机器的操作系统。新登记的实例必有此值；升级前的老实例可能为空。
        arch:
          type: string
          enum: [amd64, arm64, 386, arm]
          description: 实例所在机器的 CPU 架构。可空；部署平台在 os 与 arch 都有值时用它们决定打包平台。
        metadata: { type: object, additionalProperties: { type: string } }
        revision: { type: integer, format: int64 }
        registeredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: 这条实例的内容上次发生变化的时间 }
        lastAnnouncedAt:
          type: string
          format: date-time
          description: |
            最近一次经 PUT .../announce 上报的时间。每次上报都刷新，内容没变也刷新。
            没走过上报接口的实例没有这个字段。它不是心跳，也没有 TTL。
        registeredBy: { type: string }

    InstanceWrite:
      type: object
      required: [host, port, os]
      properties:
        id: { type: string, description: 省略则服务端生成；同步时可用来锚定"同一个实例" }
        scheme: { type: string, enum: [http, https, tcp, tls], default: http }
        host: { type: string, description: 主机名或 IP（不带协议/路径） }
        port: { type: integer, minimum: 1, maximum: 65535 }
        os:
          type: string
          enum: [linux, mac, windows]
          description: 实例所在机器的操作系统，登记时必填（大小写不敏感，存成小写）
        arch:
          type: string
          description: 实例所在机器的架构，可空。给出时收成 amd64/arm64/386/arm（x86_64、aarch64 等等价写法也会收）
        metadata: { type: object, additionalProperties: { type: string } }

    SyncResult:
      type: object
      properties:
        instances: { type: array, items: { $ref: '#/components/schemas/Instance' }, description: 对齐后的实例集合 }
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }
        unchanged: { type: integer }

    EndpointMatch:
      type: object
      description: 一次"这个接口谁提供"的命中
      properties:
        namespace: { type: string }
        service: { type: string }
        serviceVersion: { type: string }
        description: { type: string }
        gitRepoUrl: { type: string, description: 该服务的代码仓库地址（跟着命中一起返回，找源码不用再查一次） }
        mcpPath: { type: string, description: 该服务的 MCP 地址（相对实例根路径，默认 /mcp） }
        departmentId: { type: string, description: 该服务归属部门的 ID（数据来自组织接口） }
        departmentName: { type: string, description: 该服务归属部门名 }
        instanceCount: { type: integer }
        matchType: { type: string, enum: [exact, template, glob] }
        endpoint: { $ref: '#/components/schemas/Endpoint' }

    Namespace:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        tokenSet: { type: boolean, description: 是否配置了注册令牌（令牌本身永不可见） }
        serviceCount: { type: integer }
        instanceCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Change:
      type: object
      description: 一条全局递增的变更记录（既是增量拉取游标，也是审计日志）
      properties:
        revision: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        namespace: { type: string }
        entity: { type: string, enum: [namespace, service, instance, mcp_server] }
        ref: { type: string, example: default/event-center/inst_01J8Z9K3M4N5P6Q7R8S9T0V1W2 }
        op: { type: string, enum: [create, update, delete] }
        actor: { type: string, description: 'admin / ns:<name> / anonymous' }
        detail: { type: string, description: 人类可读的变更说明 }

    Snapshot:
      type: object
      properties:
        revision: { type: integer, format: int64 }
        generatedAt: { type: string, format: date-time }
        namespaces: { type: array, items: { $ref: '#/components/schemas/Namespace' } }
        services: { type: array, items: { $ref: '#/components/schemas/Service' } }
        instances: { type: array, items: { $ref: '#/components/schemas/Instance' } }

