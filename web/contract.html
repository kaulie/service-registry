<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登记服务契约 · Service Registry</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◎</span>
      <h1>Service Registry</h1>
      <span id="page-mode" class="badge badge--muted">契约</span>
      <span class="badge badge--info" title="本中心只存储元信息：不探活、不心跳、不保证实例可达">元信息存储中心</span>
    </div>
    <div class="topbar__meta">
      <a class="btn btn--small" id="back-to-panel" href="./#services">← 返回面板</a>
      <button class="btn btn--small" id="theme-toggle" type="button" title="切换主题">☀</button>
      <label class="token">
        令牌
        <input type="password" id="token" placeholder="写操作需要（admin / namespace token）" autocomplete="off" />
      </label>
    </div>
  </header>

  <main class="content content--form">
    <!-- 这个页面就是"契约编辑页"：URL 里带 ns/name 是编辑，不带是新建。
         之所以独立成页：内联在服务列表里的表单会被长列表挤到看不见的地方，
         而 OpenAPI 原文需要一大片地方；独立页面还能收藏、分享、后退。 -->
    <section class="form-card" id="contract-body" hidden>
      <h2 id="svc-form-title">登记服务契约</h2>
      <p class="note">
        页面地址就是这个契约的地址：
        <span class="mono" id="contract-url">contract.html</span>
        <span class="badge badge--muted" id="contract-exists" hidden></span>
      </p>
      <div class="form-row">
        <label>命名空间 <select id="svc-form-ns"></select></label>
        <label>服务名 <input type="text" id="svc-form-name" placeholder="event-center" /></label>
        <label>版本 <input type="text" id="svc-form-version" placeholder="1.4.2" /></label>
        <label>owner <input type="text" id="svc-form-owner" placeholder="kaulie" /></label>
        <label>healthPath <input type="text" id="svc-form-health" placeholder="/health" /></label>
      </div>
      <div class="form-row">
        <label class="grow">描述 <input type="text" id="svc-form-desc" placeholder="一句话说明这个服务是干什么的" /></label>
        <label class="grow">标签（逗号分隔） <input type="text" id="svc-form-tags" placeholder="events,pubsub" /></label>
        <label class="grow">文档链接 <input type="text" id="svc-form-docs" placeholder="https://…" /></label>
        <label class="grow">代码仓库 gitRepoUrl <input type="text" id="svc-form-repo" placeholder="https://github.com/org/repo.git 或 git@host:org/repo.git" /></label>
      </div>
      <div class="form-row">
        <label>归属部门
          <select id="svc-form-dept" title="候选来自组织架构服务；组织接口不可达时按声明值保存"></select>
        </label>
        <button class="btn btn--small" id="svc-form-dept-refresh" type="button">重新同步部门</button>
        <span class="note grow" id="svc-form-dept-note"></span>
      </div>
      <div class="form-row">
        <label>API 来源
          <select id="svc-form-mode">
            <option value="spec">粘贴 OpenAPI（推荐，自动解析端点）</option>
            <option value="manual">手工声明端点</option>
          </select>
        </label>
        <label class="grow">外部 spec 链接（可选，只存不抓取） <input type="text" id="svc-form-specurl" placeholder="https://…/openapi.yaml" /></label>
      </div>

      <div id="svc-form-spec-wrap">
        <label class="stack">OpenAPI 3.x / Swagger 2.0 原文（YAML 或 JSON）
          <textarea id="svc-form-spec" rows="14" spellcheck="false"
            placeholder="openapi: 3.0.3&#10;info:&#10;  title: event-center&#10;  version: 0.1.0&#10;paths:&#10;  /health:&#10;    get:&#10;      summary: 健康检查"></textarea>
        </label>
        <div class="actions" style="margin:6px 0">
          <button class="btn btn--small" id="svc-form-spec-template" type="button">预填最小模板</button>
          <span class="note">服务端会解析出端点索引并存 sha256；原文随时可从「下载 OpenAPI」取回。</span>
        </div>
      </div>

      <div id="svc-form-manual-wrap" hidden>
        <table id="svc-form-eps">
          <thead><tr><th style="width:110px">方法</th><th>路径</th><th>说明</th><th style="width:60px"></th></tr></thead>
          <tbody></tbody>
        </table>
        <button class="btn btn--small" id="svc-form-ep-add" type="button">＋ 加一行</button>
      </div>

      <div class="actions" style="margin-top:12px">
        <button class="btn btn--primary" id="svc-form-submit" type="button">提交</button>
        <button class="btn" id="svc-form-cancel" type="button">返回面板</button>
        <span class="hint" id="svc-form-hint"></span>
      </div>
    </section>

    <section class="form-card form-card--done" id="contract-done" hidden>
      <h2>✓ 已保存</h2>
      <p class="note" id="contract-done-text"></p>
      <div class="actions">
        <a class="btn btn--primary" href="./#services">← 回到服务目录</a>
        <a class="btn" id="contract-done-spec" href="#" target="_blank" rel="noopener">查看内联 spec</a>
        <a class="btn" href="contract.html">＋ 再登记一个</a>
      </div>
    </section>

    <section class="form-card" id="contract-loading">
      <h2>加载中…</h2>
      <p class="note">正在读取命名空间、部门目录与契约内容。</p>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="shared.js"></script>
  <script src="contract.js"></script>
</body>
</html>
