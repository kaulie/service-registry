# 本地起一个注册中心（数据落在命名卷 registry-data 里，重启不丢）。
#
#   cd deploy && docker compose up --build
#   面板：http://127.0.0.1:4240/panel/
#
# 注意：默认不设置 admin 令牌（写接口不鉴权），只适合本机试用。
# 真要用请设置 REGISTRY_ADMIN_TOKEN。
services:
  registry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${REGISTRY_IMAGE_VERSION:-dev}
    image: service-registry:${REGISTRY_IMAGE_VERSION:-dev}
    container_name: service-registry
    environment:
      # 端口统一由 SERVICE_PORT 决定（想换：SERVICE_PORT=9000 docker compose up）
      SERVICE_PORT: ${SERVICE_PORT:-4240}
      REGISTRY_BIND: 0.0.0.0
      REGISTRY_DB_PATH: /data/registry.db
      REGISTRY_DEFAULT_NS: default
      REGISTRY_READ_AUTH: open
      REGISTRY_ADMIN_TOKEN: ${REGISTRY_ADMIN_TOKEN:-}
      REGISTRY_LOG_LEVEL: ${REGISTRY_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${SERVICE_PORT:-4240}:${SERVICE_PORT:-4240}"
    volumes:
      - registry-data:/data
    restart: unless-stopped

volumes:
  registry-data:
